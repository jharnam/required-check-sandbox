name: Approval
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
jobs:
  check:
    name: Golden approval
    runs-on: ubuntu-latest
    steps:
      - env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "event=${{ github.event_name }}/${{ github.event.action }} sha=${{ github.sha }} head=${{ github.event.pull_request.head.sha }}"
          echo "body: $BODY"
          s=$(printf '%s' "$BODY" | sed -n 's/.*sleep=\([0-9]*\).*/\1/p')
          if [ -n "$s" ]; then sleep "$s"; fi
          echo "edited to always pass"
